<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0e13" media="(prefers-color-scheme: dark)" />
    <title>Quill</title>
    <script>
      // Set the theme before the first paint so a dark-mode operator never gets
      // a white flash on load. Storage can throw in a locked-down profile.
      (function () {
        try {
          var t = localStorage.getItem("quill.theme") || "system";
          var dark = t === "dark" || (t === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
